<svg
  class="tsn-icon"
  [class.tsn-icon--sm]="size === 'sm'"
  [class.tsn-icon--md]="size === 'md'"
  [class.tsn-icon--lg]="size === 'lg'"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  aria-hidden="true"
  focusable="false"
>
  <path [attr.d]="path" stroke-linecap="round" stroke-linejoin="round" />
</svg>
