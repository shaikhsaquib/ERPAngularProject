<form class="tsn-dynamic-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <ng-container *ngFor="let field of schema; trackBy: trackByName">
    <ng-container *ngIf="isVisible(field)">
      <ng-container *ngIf="field.requiredCapability; else plainField">
        <ng-container *hasPermission="field.requiredCapability">
          <ng-container *ngTemplateOutlet="fieldTpl; context: { $implicit: field }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-template #plainField>
        <ng-container *ngTemplateOutlet="fieldTpl; context: { $implicit: field }"></ng-container>
      </ng-template>
    </ng-container>
  </ng-container>

  <!--
    `fieldTpl` is declared *inside* this `<form [formGroup]>` (rather than
    after it) so that `formControlName` below resolves the `ControlContainer`
    from this form — `ngTemplateOutlet` preserves the injector of the view in
    which a template was *declared*, not the view it's instantiated into, so
    the template has to live inside the form's own view for that to work.
  -->
  <ng-template #fieldTpl let-field>
    <div class="tsn-dynamic-form__field" [ngSwitch]="field.type">
      <tsn-input
        *ngSwitchCase="'text'"
        type="text"
        [label]="field.label"
        [required]="!!field.required"
        [errorMessage]="errorMessageFor(field)"
        [formControlName]="field.name"
      ></tsn-input>

      <tsn-input
        *ngSwitchCase="'number'"
        type="number"
        [label]="field.label"
        [required]="!!field.required"
        [errorMessage]="errorMessageFor(field)"
        [formControlName]="field.name"
      ></tsn-input>

      <tsn-checkbox
        *ngSwitchCase="'checkbox'"
        [label]="field.label"
        [formControlName]="field.name"
      ></tsn-checkbox>

      <div *ngSwitchCase="'date'" class="tsn-dynamic-form__native-field">
        <label class="tsn-dynamic-form__native-label" [attr.for]="field.name">{{
          field.label
        }}</label>
        <input
          type="date"
          class="tsn-dynamic-form__native-input"
          [id]="field.name"
          [formControlName]="field.name"
        />
      </div>

      <div *ngSwitchCase="'select'" class="tsn-dynamic-form__native-field">
        <label class="tsn-dynamic-form__native-label" [attr.for]="field.name">{{
          field.label
        }}</label>
        <select
          class="tsn-dynamic-form__native-select"
          [id]="field.name"
          [formControlName]="field.name"
        >
          <option *ngFor="let option of field.options" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>
  </ng-template>

  <div class="tsn-dynamic-form__actions">
    <tsn-button type="submit" variant="primary" [disabled]="form.invalid">
      {{ submitLabel }}
    </tsn-button>
  </div>
</form>
